provenance:
  collision:
    kind: assumption
    source: Delivered CAD mesh contact with an 0.8 mm numerical skin and near-rigid
      barrier; stiffness/damping are numerical regularisation, not measured impact
      properties.
  aircraft:
    kind: assumption
    source: H1 A copied GLB lifting surfaces; lumped box masses, CG, inertia, thrust
      and profile drag assumed.
  sensor:
    kind: assumption
    source: New 120 mm cylinder, 46 mm fin span, 40 g lumped mass. Aerodynamic/contact
      properties unmeasured.
  cable:
    kind: assumption
    source: 1.5 m, 1.5 g/m, 1 mm line; EA and damping illustrative; no material tests.
  bay:
    kind: assumption
    source: New 56 x 56 mm rear guide, outlet at original x=1.14 m. Requires cutout
      through original aft lower shell. Door hinge moved aft/down 3 mm, closed leaf
      moved aft 3 mm onto the outer frame face; ideal offset hinge, no bracket or
      actuator packaging validation.
  winch:
    kind: assumption
    source: Repositioned ideal actuator; prescribed schedules, no real motor or reel
      inertia model. Door opens to 160 degrees in 0.4 s and stays open through 7 s
      for comparison.
  flight:
    kind: assumption
    source: 20 m/s, 40 m, still air, density 1.225 kg/m3. Local flow factor 1.0 is
      unvalidated.
  aero:
    kind: calculated
    source: Fresh actual AVL 3.52 on H1-A extracted lifting surfaces, no fuselage
      body; original 2-degree wing incidence; https://web.mit.edu/drela/Public/web/avl/
