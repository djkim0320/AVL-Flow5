provenance:
  collision:
    kind: assumption
    source: Delivered CAD mesh contact with an 0.8 mm numerical skin and near-rigid
      barrier; stiffness/damping are numerical regularisation, not measured impact
      properties.
  aircraft:
    kind: assumption
    source: 'New conventional high-wing TEST DESIGN: smooth closed fuselage, raised
      tail boom, tapered 1.8 m wing with 4 deg dihedral and 1 deg washout, tapered
      conventional tail, tricycle gear and nose propeller. CAD-weighted assumed masses,
      not team aircraft data. Door inertia frozen closed. Added 20 g assumed capture-stop
      mass, with its CAD-derived CG and inertia. Aircraft CG, inertia and all aircraft-relative
      geometry/tow/thrust coordinates updated; aerodynamic moment coefficients retained
      at their original physical reference point. Replaced door with extended leaf
      at original assumed effective density; added 10 g assumed pin, brackets and
      stops. Closed-pose CAD mass/CG/inertia recomputed. Door mass remains frozen
      closed in the coupled rigid-aircraft model; no servo dynamics. Flared duct assumed
      density 1200 kg/m3; removed original component mass budgets, shell mass scaled
      by removed volume, door/support source effective densities retained. Recomputed
      CAD mass, CG and inertia at closed door pose.'
  sensor:
    kind: assumption
    source: 'Candidate: unchanged 120 mm outer length and 28 mm body diameter, 14
      mm radius hemispherical nose; four existing fins clocked 45 degrees. Assumed
      total 40 g redistributed uniformly over sensor CAD solids; CG/inertia recomputed.
      Existing lumped sensor aero coefficients retained as unvalidated assumptions,
      not newly resolved sensor CFD.'
  cable:
    kind: assumption
    source: 2.7 m = 1.5 times 1.8 m reference span, requested by user; 18 cells retain
      approximately 0.15 m spacing. Linear density, drag and elastic properties remain
      unmeasured assumptions. Cable aerodynamic exposure is the length-weighted rear-opening
      fraction of the two half-spans around each node. Outside uses the declared local-flow
      factor; inside air is assumed to co-move with the aircraft, so only cable motion
      relative to that internal air creates drag. This is an unmeasured shielding
      assumption, not a resolved cabin/wake flow.
  bay:
    kind: assumption
    source: 'Actual CAD flared recovery duct: 80x120 mm mouth, continuous taper to
      50x50 mm throat, 2 mm walls. Old rectangular frame, box guides and separate
      ramps removed. Fuselage cutout follows duct; 152x80 mm door, 270 degree fold.
      Capture thresholds and contact laws unchanged. Structural strength and local
      airflow unverified.'
  winch:
    kind: assumption
    source: 'Feed point outside drum, forward relocated winch; prescribed decelerating
      length schedule with slow final approach. No torque-limited motor dynamics.
      Release push stops before retrieval. Door closing delayed until capture, with
      a 0.2 s latch hold; commanded closing duration retained. User mission: full
      payout 2.7 m, then hold exactly 60 s before recovery. Existing payout/recovery
      speeds and final approach retained; door remains capture-interlocked.'
  flight:
    kind: assumption
    source: 100 m, 25 m/s still-air reference; new geometry. Existing longitudinal
      controller and assumptions retained.
  aero:
    kind: calculated
    source: Actual flow5 7.57 25 m/s R3 lifting-surface database reused; wing and
      tail unchanged. Updated mass/CG/inertia and original aerodynamic moment reference.
      Extended door/bracket local flow and drag are not resolved by this database.
  controller:
    kind: assumption
    source: 'User-authorized longitudinal control experiment. Altitude/climb-rate
      to pitch, pitch/rate to elevator, airspeed to thrust. PD/P without integral,
      perfect state measurement and instantaneous bounded actuators. Gains and limits
      are prototype choices, not measured hardware characteristics. Architecture context:
      https://docs.px4.io/main/en/flight_stack/controller_diagrams ; not a PX4/TECS
      implementation.'
