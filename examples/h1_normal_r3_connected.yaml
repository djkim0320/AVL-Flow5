provenance:
  collision:
    kind: assumption
    source: Delivered CAD mesh contact with an 0.8 mm numerical skin and near-rigid
      barrier; stiffness/damping are numerical regularisation, not measured impact
      properties.
  aircraft:
    kind: assumption
    source: 'New conventional high-wing TEST DESIGN: smooth closed fuselage, raised
      tail boom, tapered 1.8 m wing with 4 deg dihedral and 1 deg washout, tapered
      conventional tail, tricycle gear and nose propeller. CAD-weighted assumed masses,
      not team aircraft data. Door inertia frozen closed.'
  sensor:
    kind: assumption
    source: New 120 mm cylinder, 46 mm fin span, 40 g lumped mass. Aerodynamic/contact
      properties unmeasured.
  cable:
    kind: assumption
    source: 1.5 m, 1.5 g/m, 1 mm line; EA and damping illustrative; no material tests.
  bay:
    kind: assumption
    source: 56x70 mm rear opening, 140-degree offset door, passive 50x50 mm capture
      throat, forward fairlead; geometric design assumptions, no structure/material
      qualification.
  winch:
    kind: assumption
    source: Feed point outside drum, forward relocated winch; prescribed decelerating
      length schedule with slow final approach. No torque-limited motor dynamics.
      Release push stops before retrieval. Door closing delayed until capture, with
      a 0.2 s latch hold; commanded closing duration retained.
  flight:
    kind: assumption
    source: 20 m/s, 40 m, still air, density 1.225 kg/m3. Local flow factor 1.0 is
      unvalidated.
  aero:
    kind: calculated
    source: Actual AVL 3.52 on the new R3 planform, twist and dihedral; copied H1
      airfoil coordinates retained. Equivalent-area body from exact outer-CAD cross
      sections; body/no-body sensitivity required. Gear/propeller/profile drag and
      open-door wake remain unmeasured. https://web.mit.edu/drela/Public/web/avl/avl_doc.txt
