    source: 'New conventional high-wing TEST DESIGN: smooth closed fuselage, raised
      tail boom, tapered 1.8 m wing with 4 deg dihedral and 1 deg washout, tapered
      conventional tail, tricycle gear and nose propeller. CAD-weighted assumed masses,
      not team aircraft data. Door inertia frozen closed.'
  sensor:
    kind: assumption
    source: 'Candidate: unchanged 120 mm outer length and 28 mm body diameter, 14
      mm radius hemispherical nose; four existing fins clocked 45 degrees. Assumed
      total 40 g redistributed uniformly over sensor CAD solids; CG/inertia recomputed.
      Existing lumped sensor aero coefficients retained as unvalidated assumptions,
      not newly resolved sensor CFD.'
  cable:
    kind: assumption
    source: 2.7 m = 1.5 times 1.8 m reference span, requested by user; 18 cells retain
      approximately 0.15 m spacing. Linear density, drag and elastic properties remain
      unmeasured assumptions.
  bay:
    kind: assumption
    source: 56x70 mm rear opening, 140-degree offset door, passive 50x50 mm capture
      throat, forward fairlead; geometric design assumptions, no structure/material
      qualification. Capture CG coordinate updated for the new sensor mass centre;
      same physical stowed body pose, same guide/door/fairlead geometry and capture
      tolerances.
  winch:
    kind: assumption
    source: 'Feed point outside drum, forward relocated winch; prescribed decelerating
      length schedule with slow final approach. No torque-limited motor dynamics.
      Release push stops before retrieval. Door closing delayed until capture, with
      a 0.2 s latch hold; commanded closing duration retained. User mission: full
      payout 2.7 m, then hold exactly 60 s before recovery. Existing payout/recovery
      speeds and final approach retained; door remains capture-interlocked. Repair
      trial: final retrieval slowed to 0.04 m/s after a 0.6 s deceleration; 1 s braking;
      same capture and physical contact limits. Prescribed speed, not torque-controlled
      motor dynamics.'
  flight:
    kind: assumption
    source: 100 m above model ground, 25 m/s; same still air/density assumptions as
      uncontrolled experiment. Explicit longitudinal feedback enabled at full payout
      (4.135815755488593 s), ramped in over 1 s. Original recorded state at activation
      retained exactly.
  aero:
    kind: calculated
    source: Reuses actual flow5 7.57 25 m/s R3 lifting-surface database. Aircraft
      geometry/mass are unchanged. Sensor aerodynamic coefficients remain explicitly
      assumed.
  controller:
    kind: assumption
    source: 'User-authorized longitudinal control experiment. Altitude/climb-rate
      to pitch, pitch/rate to elevator, airspeed to thrust. PD/P without integral,
      perfect state measurement and instantaneous bounded actuators. Gains and limits
      are prototype choices, not measured hardware characteristics. Architecture context:
      https://docs.px4.io/main/en/flight_stack/controller_diagrams ; not a PX4/TECS
      implementation.'
