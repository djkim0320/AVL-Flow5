<!doctype html><html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBF 해석 결과 재생</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dbf-theme')==='light'?'light':'dark';}catch{}</script>
<link rel="icon" href="favicon.svg"><link rel="stylesheet" href="theme.css"><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased}
header,footer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--surface)}
header{border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line)}
h1{margin:0;font-size:15px;font-weight:650}p{margin:0;font-size:12px;color:var(--text-2)}
a{color:var(--accent-text);font-weight:500}
#message{flex:1;min-width:200px}
#scene{flex:1;min-height:250px;position:relative;background:radial-gradient(ellipse 85% 75% at 50% 45%,var(--vp-center),var(--vp-edge))}canvas{position:absolute;inset:0}
button,select{font:inherit;color:inherit;border-radius:6px;cursor:pointer}
button{min-height:34px;padding:6px 18px;background:var(--accent);color:var(--on-accent);border:0;font-weight:600}button:disabled{background:var(--surface-3);color:var(--text-3);cursor:not-allowed}
select{min-height:32px;padding:4px 8px;margin-left:6px;background:var(--surface-2);border:1px solid var(--line-2)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
#time{font:12.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}
label{font-size:12px;color:var(--text-2)}
footer p{color:var(--text-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body><header><h1>해석 결과 3D 재생</h1><p id="message" role="status">계산 결과를 불러오는 중…</p><a id="report">결과 보고서</a></header><main id="scene" aria-label="실제 계산 상태의 기체 CG를 추적하는 3D 재생"></main><footer><button id="play" disabled>재생</button><input id="frame" type="range" min="0" max="0" value="0" aria-label="재생 시각" disabled><span id="time">0.000 s</span><label>배속<select id="rate"><option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select></label><p>격자는 자세 참고용입니다.</p></footer><script type="module" src="analysis-replay.js"></script></body></html>
